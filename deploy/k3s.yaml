# =============================================================================
# Volleyhub — k3s deployment onto the server that already runs kindergarten
# =============================================================================
# Deploys ONLY the three Volleyhub services (API, backoffice, mobile web) into
# their own `volleyhub` namespace. Postgres is NOT deployed here: the existing
# kindergarten Postgres is reused, with a separate database and a separate user.
#
#   ┌─ namespace: volleyhub ────────────┐   ┌─ namespace: kindergarten ─┐
#   │ volleyhub-api        :30090       │──▶│ kindergarten-postgres     │
#   │ volleyhub-backoffice :30030       │   │   db: volleyhub-db        │
#   │ volleyhub-mobile     :30080       │   │   user: volleyhub         │
#   └───────────────────────────────────┘   └───────────────────────────┘
#
# WHY A SEPARATE DATABASE: Volleyhub and kindergarten both create
# `public.tenant` / `public.account` and both name their per-tenant schemas
# `tenant_<id>`. Sharing one database would have them overwrite each other.
#
# ⚠ NO TLS. These are plain-HTTP NodePorts, so passwords and JWTs travel in the
#   clear. Fine on a private network or for a pilot; before real users, put this
#   behind the existing ingress-nginx + cert-manager with proper hostnames (the
#   only changes needed are an Ingress object and the two URLs in the ConfigMap).
#
# ⚠ REAL SECRETS LIVE IN THIS FILE and it is tracked by git. Anyone who can read
#   the repository can read the database password and the JWT signing key. Keep
#   the repository private, and rotate these values if that ever stops being true.
#
# -----------------------------------------------------------------------------
# ORDER OF OPERATIONS
#   1. Create the Postgres role + database, using the DB_PASSWORD already set in
#      `volleyhub-secrets` below:
#        VOLLEYHUB_DB_PASSWORD='f3f787862b990e91d3663ff306ffc4a84164' \
#          sh deploy/bootstrap-db.sh
#   2. k3s kubectl apply -f deploy/k3s.yaml
#      (Images live under the `maraa` Docker Hub account. Applying before the
#      first CI build leaves the pods in ImagePullBackOff; they recover on their
#      own once the images are pushed.)
#   3. k3s kubectl -n volleyhub get pods -w
#
# The API creates its own schemas at startup, so there is no migration step.
# Registering with 90119067 gets the platform-admin role, which is what reviews
# club registration applications at /admin.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: volleyhub
---
# ----------------------------------------------------------------------------
# Secrets. CHANGE EVERY VALUE. DB_PASSWORD must match what bootstrap-db.sh used.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: volleyhub-secrets
  namespace: volleyhub
type: Opaque
stringData:
  # Password of the dedicated `volleyhub` Postgres role (NOT the kindergarten admin one).
  DB_PASSWORD: "f3f787862b990e91d3663ff306ffc4a84164"
  # MinIO root credentials. Volleyhub runs its own MinIO rather than sharing the one that serves
  # kindergarten, so nothing here is shared between the two products.
  MINIO_ROOT_USER: "volleyhub"
  MINIO_ROOT_PASSWORD: "8f4c1d90a7b23e6584cf0d1b7e92a4c5"
  # JWT signing key: any long random string. Changing it invalidates every issued token.
  #   openssl rand -hex 48
  AppSettings__Token: "2fd33607d904c0089b0d8079b734e062e4f5e248a4ee1bc592242b712758cbcabe656128dca793e6b3e8f1361bbff284"
  # NextAuth session cookie secret.
  #   openssl rand -hex 32
  NEXTAUTH_SECRET: "bdcaf5399f0c3bff0a72c6fd90baef1706a568162d68964ef0b37f917768534e"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: volleyhub-config
  namespace: volleyhub
data:
  # Cross-namespace DNS to the Postgres that already serves kindergarten.
  DB_HOST: "kindergarten-postgres.kindergarten.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "volleyhub-db"
  DB_USER: "volleyhub"
  ASPNETCORE_ENVIRONMENT: "Production"
  # Public URL of the API (node IP + its NodePort). Used for absolute links the
  # backend generates; must be reachable by clients.
  APP_PUBLIC_BASE_URL: "http://187.127.116.47:30090"
  # Public URL of the admin web. NextAuth builds its callbacks from this, so a
  # wrong value here breaks login even though the pages still render.
  NEXTAUTH_URL: "http://187.127.116.47:30030"
  # MinIO is only ever reached from inside the cluster: the API uploads here, and serves the
  # bytes back out over its own port. Nothing outside talks to MinIO directly, so it needs no
  # public address and no port of its own.
  STORAGE_INTERNAL_URL: "http://volleyhub-minio:9000"
  STORAGE_BUCKET: "volleyhub"
  # Phone numbers granted the platform-admin role - they review club registration
  # applications at /admin. Set this BEFORE anyone registers: on a fresh database
  # the operator signs up with this number and gets the role on the spot.
  # Comma-separated; the role is also granted at login, so adding one here
  # promotes that person on their next sign-in.
  PLATFORM_ADMIN_PHONES: "90119067"
---
# ============================================================================
# Backend (.NET API) — container port 8080, exposed on node port 30090
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volleyhub-api
  namespace: volleyhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyhub-api
  template:
    metadata:
      labels:
        app: volleyhub-api
    spec:
      # The API provisions every club schema at startup, so it must not start
      # before Postgres is accepting connections.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: DB_HOST } }
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p 5432; do echo waiting for db; sleep 2; done
      containers:
        - name: api
          image: maraa/volleyhub-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: ASPNETCORE_ENVIRONMENT } }
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: DB_PASSWORD } }
            # EF connection string, assembled from the env vars above.
            - name: ConnectionStrings__dbCon
              value: "Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD)"
            - name: App__PublicBaseUrl
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: APP_PUBLIC_BASE_URL } }
            - name: PLATFORM_ADMIN_PHONES
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: PLATFORM_ADMIN_PHONES } }
            - name: AppSettings__Token
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: AppSettings__Token } }
            # Image storage. The URL written into an image field is built from App__PublicBaseUrl
            # above, because images are served back through this API - see S3FileStorage.
            - name: Storage__InternalUrl
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: STORAGE_INTERNAL_URL } }
            - name: Storage__Bucket
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: STORAGE_BUCKET } }
            - name: Storage__AccessKey
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_USER } }
            - name: Storage__SecretKey
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_PASSWORD } }
          readinessProbe:
            httpGet: { path: /api/vh/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: volleyhub-api
  namespace: volleyhub
spec:
  # NodePort: the mobile app talks to the API directly, so it has to be reachable
  # from outside the cluster. In-cluster callers (the backoffice) keep using the
  # ClusterIP name http://volleyhub-api:8080.
  type: NodePort
  selector:
    app: volleyhub-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
---
# ============================================================================
# MinIO — S3-compatible image storage, in-cluster only
# ============================================================================
# Volleyhub's own instance: the bucket, credentials and disk belong to this
# platform and are shared with nothing else on the cluster.
#
# Deliberately NOT exposed outside the cluster. Kindergarten can point a browser
# straight at MinIO because it has a domain and its ingress serves s3.<domain> on
# 443, a port that is open anyway. With no domain, exposing MinIO would mean a
# second NodePort and another firewall hole - so instead the API streams images
# back out over its own port (/api/vh/public/media/...). The bucket stays private.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: volleyhub-minio-pvc
  namespace: volleyhub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volleyhub-minio
  namespace: volleyhub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: volleyhub-minio
  template:
    metadata:
      labels:
        app: volleyhub-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: volleyhub-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: volleyhub-minio
  namespace: volleyhub
spec:
  # ClusterIP: only the API talks to MinIO, in both directions.
  type: ClusterIP
  selector:
    app: volleyhub-minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
# Creates the bucket. Idempotent, so it is safe to re-apply; delete the Job first
# if you need to run it again
# (kubectl -n volleyhub delete job volleyhub-minio-init).
apiVersion: batch/v1
kind: Job
metadata:
  name: volleyhub-minio-init
  namespace: volleyhub
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: BUCKET
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: STORAGE_BUCKET } }
          command:
            - sh
            - -c
            - |
              until mc alias set vh http://volleyhub-minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo waiting for minio; sleep 3;
              done
              mc mb --ignore-existing "vh/$BUCKET"
              # No anonymous policy: nothing outside the cluster reaches MinIO, and the API is
              # what serves images to visitors.
              echo "bucket $BUCKET ready"
---
# ============================================================================
# Backoffice (Next.js admin) — container port 3000, node port 30030
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volleyhub-backoffice
  namespace: volleyhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyhub-backoffice
  template:
    metadata:
      labels:
        app: volleyhub-backoffice
    spec:
      containers:
        - name: backoffice
          image: maraa/volleyhub-backoffice:latest
          ports:
            - containerPort: 3000
          env:
            # Server-side only: the browser calls /api/ui/* on this same origin and
            # the proxy forwards from here, so the in-cluster address is correct and
            # nothing is baked into the image.
            - name: API_BASE_URL
              value: "http://volleyhub-api:8080"
            - name: NEXTAUTH_URL
              valueFrom: { configMapKeyRef: { name: volleyhub-config, key: NEXTAUTH_URL } }
            - name: NEXTAUTH_SECRET
              valueFrom: { secretKeyRef: { name: volleyhub-secrets, key: NEXTAUTH_SECRET } }
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: volleyhub-backoffice
  namespace: volleyhub
spec:
  type: NodePort
  selector:
    app: volleyhub-backoffice
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
---
# ============================================================================
# Mobile (Expo web export, served by nginx) — container port 80, node port 30080
# ============================================================================
# The native apps ship through EAS; this is the browser build of the same code.
# Its API URL is baked in at export time (EXPO_PUBLIC_API_URL), so rebuild the
# image if the node IP or API port ever changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volleyhub-mobile
  namespace: volleyhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volleyhub-mobile
  template:
    metadata:
      labels:
        app: volleyhub-mobile
    spec:
      containers:
        - name: mobile
          image: maraa/volleyhub-mobile:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: volleyhub-mobile
  namespace: volleyhub
spec:
  type: NodePort
  selector:
    app: volleyhub-mobile
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
