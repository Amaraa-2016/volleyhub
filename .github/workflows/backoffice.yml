name: backoffice CI CD

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "backoffice/**"

jobs:
  push_to_registry:
    name: Build & deploy backoffice
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      # docker/login-action only says "Username and password required" when a secret is
      # empty, which looks identical whether the secret is missing, misnamed, stored as a
      # Variable, or scoped to an Environment. Naming the empty ones costs one step.
      - name: Check required secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=""
          for name in DOCKER_USERNAME DOCKER_PASSWORD HOST USERNAME SSH_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Empty or missing repository secrets:$missing"
            echo "Settings > Secrets and variables > Actions > Secrets tab > Repository secrets."
            echo "They must be Secrets (not Variables) and repository-scoped (not Environment),"
            echo "on this repository, spelled exactly as above."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice
          file: ./backoffice/Dockerfile
          push: true
          # No build args: the backend URL is a runtime setting (API_BASE_URL in the
          # Deployment), so one image works in every environment.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:latest

      - name: Deploy over SSH (k3s rollout)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            k3s kubectl -n volleyhub set image deployment/volleyhub-backoffice backoffice=${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:${{ github.run_number }}
            k3s kubectl -n volleyhub rollout status deployment/volleyhub-backoffice --timeout=180s
