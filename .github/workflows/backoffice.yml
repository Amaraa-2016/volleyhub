name: backoffice CI CD

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "backoffice/**"

jobs:
  push_to_registry:
    name: Build & deploy backoffice
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice
          file: ./backoffice/Dockerfile
          push: true
          # No build args: the backend URL is a runtime setting (API_BASE_URL in the
          # Deployment), so one image works in every environment.
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:latest

      - name: Deploy over SSH (k3s rollout)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            k3s kubectl -n volleyhub set image deployment/volleyhub-backoffice backoffice=${{ secrets.DOCKER_USERNAME }}/volleyhub-backoffice:${{ github.run_number }}
            k3s kubectl -n volleyhub rollout status deployment/volleyhub-backoffice --timeout=180s
