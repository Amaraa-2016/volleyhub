name: backend CI CD

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  push_to_registry:
    name: Build & deploy volleyhub-api
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-api:${{ github.run_number }}
            ${{ secrets.DOCKER_USERNAME }}/volleyhub-api:latest

      - name: Deploy over SSH (k3s rollout)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            k3s kubectl -n volleyhub set image deployment/volleyhub-api api=${{ secrets.DOCKER_USERNAME }}/volleyhub-api:${{ github.run_number }}
            k3s kubectl -n volleyhub rollout status deployment/volleyhub-api --timeout=180s
